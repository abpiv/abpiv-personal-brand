name: Plan or apply private n8n infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate evidence first; apply only in a later reviewed dispatch.
        required: true
        type: choice
        options: [plan, apply]
      confirm_plan:
        description: In plan mode, type plan-private-n8n-infrastructure.
        required: false
        type: string
      confirm_apply:
        description: In apply mode, type apply-reviewed-private-n8n-infrastructure.
        required: false
        type: string
      review_decision:
        description: In apply mode, enter COMPLIANT / APPROVED / READY from the independent reviewer.
        required: false
        type: string
      reviewer_identity:
        description: In apply mode, record the independent reviewer's durable identity.
        required: false
        type: string
      reviewed_commit_sha:
        description: In apply mode, enter the exact 40-character commit SHA from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_manifest_sha256:
        description: In apply mode, enter the exact manifest SHA-256 from the reviewed plan dispatch.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
  GCP_ZONE: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  VM_NAME: abpiv-runtime-vm
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  infrastructure:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (inputs.mode == 'plan' && inputs.confirm_plan == 'plan-private-n8n-infrastructure') ||
        (
          inputs.mode == 'apply' &&
          inputs.confirm_apply == 'apply-reviewed-private-n8n-infrastructure' &&
          inputs.review_decision == 'COMPLIANT / APPROVED / READY' &&
          inputs.reviewer_identity != '' &&
          inputs.reviewed_commit_sha != '' &&
          inputs.reviewed_manifest_sha256 != ''
        )
      )
    name: ${{ inputs.mode == 'apply' && 'Apply reviewed private n8n infrastructure' || 'Plan private n8n infrastructure' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'production' || 'production-plan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bind apply to the exact reviewed commit
        if: inputs.mode == 'apply'
        env:
          REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT_SHA"

      - name: Check required configuration
        env:
          GCP_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FORMS_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
          EDITOR_ZONE_ID: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_SERVICE_ACCOUNT WORKLOAD_IDENTITY_PROVIDER CLOUDFLARE_ACCOUNT_ID FORMS_ZONE_ID EDITOR_ZONE_ID CLOUDFLARE_API_TOKEN; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1

      - name: Verify the current private runtime and public controls
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo /opt/abpiv-n8n/scripts/verify-runtime.sh"
          editor_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://workflows.lobst3rs.com/)"
          forms_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://forms.allanbpediniv.com/rest/settings)"
          test "$editor_status" = "302"
          test "$forms_status" = "403"

      - name: Generate exact plan and review manifest
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -out=infrastructure.tfplan
          tofu -chdir="$TOFU_DIR" show -json infrastructure.tfplan > infrastructure-plan.json
          tofu -chdir="$TOFU_DIR" show -no-color infrastructure.tfplan > infrastructure-plan.txt
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.address)\t\(.change.actions | join(","))"' infrastructure-plan.json \
            | LC_ALL=C sort > infrastructure-actions.txt
          values_sha="$(python infra/n8n/tools/canonical-plan-values.py infrastructure-plan.json infrastructure-plan-values.json)"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'plan-values-sha256=%s\n' "$values_sha"
            printf '%s\n' 'actions:'
            cat infrastructure-actions.txt
          } > infrastructure-manifest.txt
          sha256sum infrastructure-manifest.txt | tee infrastructure-manifest.sha256
          manifest_sha="$(cut -d' ' -f1 infrastructure-manifest.sha256)"
          {
            printf '### Private n8n infrastructure plan\n\n'
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Manifest SHA-256: %s\n\n' "$manifest_sha"
            printf '```text\n'
            cat infrastructure-manifest.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted review evidence
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: private-n8n-infrastructure-plan-${{ github.sha }}
          path: |
            infrastructure-plan.txt
            infrastructure-plan-values.json
            infrastructure-actions.txt
            infrastructure-manifest.txt
            infrastructure-manifest.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Match the independently reviewed manifest
        if: inputs.mode == 'apply'
        env:
          REVIEWED_MANIFEST_SHA256: ${{ inputs.reviewed_manifest_sha256 }}
          REVIEWER_IDENTITY: ${{ inputs.reviewer_identity }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual_manifest_sha="$(cut -d' ' -f1 infrastructure-manifest.sha256)"
          test "$actual_manifest_sha" = "$REVIEWED_MANIFEST_SHA256"
          printf 'Reviewed manifest matched for reviewer %s.\n' "$REVIEWER_IDENTITY" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply only the freshly regenerated reviewed plan
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve infrastructure.tfplan

      - name: Prove full-root convergence
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          set +e
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode -no-color
          plan_status=$?
          set -e
          test "$plan_status" -eq 0

      - name: Reverify the private runtime and public controls
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo /opt/abpiv-n8n/scripts/verify-runtime.sh"
          editor_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://workflows.lobst3rs.com/)"
          forms_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://forms.allanbpediniv.com/rest/settings)"
          test "$editor_status" = "302"
          test "$forms_status" = "403"

      - name: Remove plan material from the runner
        if: always()
        run: |
          rm -f "$TOFU_DIR/infrastructure.tfplan" \
            infrastructure-plan.json \
            infrastructure-plan.txt \
            infrastructure-plan-values.json \
            infrastructure-actions.txt \
            infrastructure-manifest.txt \
            infrastructure-manifest.sha256
