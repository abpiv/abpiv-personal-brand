name: Validate n8n Infrastructure

on:
  push:
    branches: [preview, main]
    paths:
      - 'infra/n8n/**'
      - 'infra/analytics/compute/**'
      - 'infra/analytics/tests/**'
      - '.github/workflows/n8n-*.yml'
      - '.github/workflows/plausible-*.yml'
  pull_request:
    paths:
      - 'infra/n8n/**'
      - 'infra/analytics/compute/**'
      - 'infra/analytics/tests/**'
      - '.github/workflows/n8n-*.yml'
      - '.github/workflows/plausible-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: n8n-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOFU_DIR: infra/n8n/opentofu
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: ${{ vars.N8N_ENABLE_CLOUDFLARE_EDGE || 'false' }}
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}

jobs:
  validate:
    name: Validate n8n infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID_ALLANBPEDINIV: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
          CLOUDFLARE_ZONE_ID_LOBST3RS: ${{ vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
          N8N_ENABLE_CLOUDFLARE_EDGE: ${{ vars.N8N_ENABLE_CLOUDFLARE_EDGE || 'false' }}
          N8N_EDITOR_ACCESS_ALLOWED_EMAILS: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
          N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
          N8N_EDITOR_HOSTNAME: ${{ vars.N8N_EDITOR_HOSTNAME }}
          N8N_EDITOR_ZONE_ID: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
          N8N_EDITOR_ZONE_NAME: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
          N8N_GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
          N8N_GCP_REGION: ${{ vars.N8N_GCP_REGION }}
          N8N_GCP_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
          N8N_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          missing=0

          for name in \
            N8N_GCP_PROJECT_ID \
            N8N_GCP_REGION \
            N8N_GCP_SERVICE_ACCOUNT \
            N8N_GCP_WORKLOAD_IDENTITY_PROVIDER
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing required configuration::$name is not configured"
              missing=1
            fi
          done

          if [ "$N8N_ENABLE_CLOUDFLARE_EDGE" = "true" ]; then
            for name in \
              CLOUDFLARE_ACCOUNT_ID \
              CLOUDFLARE_ZONE_ID_ALLANBPEDINIV \
              CLOUDFLARE_ZONE_ID_LOBST3RS
            do
              if [ -z "${!name}" ]; then
                echo "::error title=Missing required Cloudflare configuration::$name is required when N8N_ENABLE_CLOUDFLARE_EDGE is true"
                missing=1
              fi
            done
          fi

          if [ -n "$N8N_EDITOR_HOSTNAME" ]; then
            if [ -z "$N8N_EDITOR_ZONE_ID" ] && [ -z "$N8N_EDITOR_ZONE_NAME" ]; then
              echo "::error title=Missing required editor Cloudflare configuration::Set N8N_EDITOR_ZONE_ID or N8N_EDITOR_ZONE_NAME when N8N_EDITOR_HOSTNAME is configured"
              missing=1
            fi

            if [ "$N8N_EDITOR_ACCESS_ALLOWED_EMAILS" = "[]" ] && [ "$N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS" = "[]" ]; then
              echo "::error title=Missing required editor Access configuration::Set N8N_EDITOR_ACCESS_ALLOWED_EMAILS or N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS when N8N_EDITOR_HOSTNAME is configured"
              missing=1
            fi
          fi

          exit "$missing"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive ${{ env.TOFU_DIR }}

      - name: Run private-runtime contract tests
        shell: pwsh
        run: |
          ./infra/n8n/tests/compute-runtime-contract.ps1
          ./infra/analytics/tests/shared-runtime-contract.ps1

      - name: Validate runtime scripts and Compose model
        run: |
          set -euo pipefail
          validation_fixture_paths_owned=false
          cleanup_validation_fixtures() {
            status=$?
            set +e
            if "$validation_fixture_paths_owned"; then
              sudo rm -rf -- /run/n8n /run/plausible /srv/plausible
            fi
            trap - EXIT
            exit "$status"
          }
          trap cleanup_validation_fixtures EXIT
          for path in /run/n8n /run/plausible /srv/plausible; do
            if sudo test -e "$path"; then
              echo "Refusing to replace existing validation fixture path: $path" >&2
              exit 1
            fi
          done
          validation_fixture_paths_owned=true

          find infra/n8n/compute/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find infra/analytics/compute/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n infra/analytics/tests/restore-rehearsal.sh
          shellcheck infra/n8n/compute/scripts/*.sh infra/analytics/compute/scripts/*.sh infra/analytics/tests/restore-rehearsal.sh
          python -m py_compile infra/n8n/tools/canonical-plan-values.py
          python -m unittest discover -s infra/n8n/tests -p 'test_*.py'
          sudo install -d -m 0700 /run/n8n
          sudo install -m 0600 /dev/null /run/n8n/runtime.env
          sudo install -m 0600 /dev/null /run/n8n/postgres.env
          docker compose --project-directory infra/n8n/compute --file infra/n8n/compute/docker-compose.yml config --quiet
          sudo install -d -m 0700 /run/plausible
          for name in POSTGRES_PASSWORD SECRET_KEY_BASE DATABASE_URL; do
            sudo install -m 0400 /dev/null "/run/plausible/$name"
          done
          sudo install -d -m 0750 /srv/plausible/state /srv/plausible/postgres /srv/plausible/clickhouse-data /srv/plausible/clickhouse-logs /srv/plausible/clickhouse-backups
          docker compose --project-directory infra/analytics/compute --file infra/analytics/compute/docker-compose.yml config --quiet
          for config in infra/n8n/compute/nginx/*.conf; do
            docker run --rm --add-host n8n:127.0.0.1 \
              --volume "$PWD/$config:/etc/nginx/conf.d/default.conf:ro" \
              docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de nginx -t
          done
          for config in infra/analytics/compute/nginx/*.conf; do
            docker run --rm --add-host plausible:127.0.0.1 \
              --volume "$PWD/$config:/etc/nginx/conf.d/default.conf:ro" \
              docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de nginx -t
          done

      - name: Rehearse Plausible database and state restore with pinned images
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install --yes --no-install-recommends age >/dev/null
          bash infra/analytics/tests/restore-rehearsal.sh

      - name: Initialize OpenTofu
        run: tofu -chdir=${{ env.TOFU_DIR }} init -input=false

      - name: Validate OpenTofu
        run: tofu -chdir=${{ env.TOFU_DIR }} validate

      - name: Test OpenTofu safety invariants
        run: tofu -chdir=${{ env.TOFU_DIR }} test
