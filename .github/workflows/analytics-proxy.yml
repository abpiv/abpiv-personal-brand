name: Analytics Proxy

on:
  pull_request:
    branches: [preview, main]
    paths:
      - 'infra/analytics/worker/**'
      - '.github/workflows/analytics-proxy.yml'
  push:
    branches: [preview, main]
    paths:
      - 'infra/analytics/worker/**'
      - '.github/workflows/analytics-proxy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment.
        required: true
        type: choice
        options: [preview, production]
        default: preview
      confirm_deploy:
        description: Type deploy to publish only the analytics collection Worker.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: analytics-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/analytics/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/analytics/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code dist/index.js

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((github.ref == 'refs/heads/main' && inputs.target == 'production') ||
       (github.ref == 'refs/heads/preview' && inputs.target == 'preview')) &&
      inputs.confirm_deploy == 'deploy'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/analytics/worker/package-lock.json
      - run: npm ci
        working-directory: infra/analytics/worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/analytics/worker
          command: deploy --keep-vars ${{ inputs.target == 'preview' && '--env preview' || '' }}
